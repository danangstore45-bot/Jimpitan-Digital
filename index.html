<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Jimpitan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library untuk QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-600">Jimpitan Digital</h1>
        
        <!-- Scanner Section -->
        <div class="mb-4 space-y-3">
            <div class="flex gap-2">
                <button id="btnMulai" onclick="mulaiPengambilan()" class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">Mulai Pengambilan</button>
                <button id="btnAkhiri" onclick="akhiriPengambilan()" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 disabled:opacity-50" disabled>Akhiri Pengambilan</button>
            </div>
            <div class="text-sm text-gray-600">Status: <span id="sessionStatus" class="font-semibold text-gray-700">Belum dimulai</span></div>
            <div class="text-sm text-gray-600">Ringkasan sesi: <span id="sessionSummary" class="font-semibold text-gray-700">0 data, total Rp 0</span></div>
            <div class="flex items-center justify-between mb-2">
                <div id="scanStatus" class="text-sm text-gray-600">Klik &quot;Mulai Pengambilan&quot; untuk memulai scan.</div>
                <button id="restartScanner" onclick="mulaiScanner()" class="text-indigo-600 hover:text-indigo-800 hidden">Scan lagi</button>
            </div>
            <div id="reader" class="rounded-lg overflow-hidden"></div>
        </div>
        
        <!-- Form Input -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium">Nama Warga / ID Rumah</label>
                <input type="text" id="wargaId" class="w-full border rounded p-2" placeholder="Scan QR atau ketik manual" disabled>
            </div>
            <div>
                <label class="block text-sm font-medium">Jumlah (Rp)</label>
                <input type="number" id="jumlah" value="1000" class="w-full border rounded p-2" disabled>
            </div>
            <button id="btnSimpan" onclick="simpanData()" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50" disabled>
                Simpan Data
            </button>
        </div>

        <hr class="my-6">

        <!-- History Table -->
        <h2 class="font-bold mb-2 text-gray-700">Riwayat Hari Ini</h2>
        <div class="overflow-x-auto border rounded-lg" style="max-height: 300px; overflow-y: auto;">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 sticky top-0">
                    <tr>
                        <th class="p-2">Warga</th>
                        <th class="p-2 text-right">Jumlah</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
        <button id="btnTampilkanSemua" onclick="toggleShowAll()" class="mt-2 text-indigo-600 hover:text-indigo-800 text-sm font-semibold hidden">Tampilkan Semua</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>
</body>
</html>
